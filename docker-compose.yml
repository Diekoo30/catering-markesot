services:
  app:
    image: ${APP_IMAGE:-catering-markesot-app:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/storage
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  nginx:
    image: ${WEB_IMAGE:-catering-markesot-web:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    deploy:
      restart_policy:
        condition: any
        delay: 5s
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-catering}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:-markesot}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend

  queue:
    image: ${APP_IMAGE:-catering-markesot-app:production}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor default --max=100 >/dev/null 2>&1 || php -v >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend

networks:
  backend:
    name: ${APP_NETWORK:-catering_backend}
    driver: bridge

volumes:
  app_storage:
  mysql_data:
  redis_data:
